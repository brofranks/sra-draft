name: BDD coverage experiments
on:
  push:
    branches: [coverage/bdd-3af3bab-pu1bhktm-probes]
permissions:
  contents: read
jobs:
  coverage:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: probes-only, rust: nightly-2026-11-19}
          - {profile: count-only, rust: nightly-2026-11-19}
          - {profile: count-and-probes, rust: nightly-2026-11-19}
          - {profile: ignore-level, rust: 1.100.0}
          - {profile: ignore-edges, rust: 1.100.0}
          - {profile: image, rust: 1.100.0}
          - {profile: preimage, rust: 1.100.0}
          - {profile: ite, rust: 1.100.0}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - if: startsWith(matrix.profile, 'count-') || matrix.profile == 'probes-only'
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component llvm-tools-preview
      - if: startsWith(matrix.profile, 'count-') == false && matrix.profile != 'probes-only'
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Install cargo-llvm-cov 0.9.1
        if: startsWith(matrix.profile, 'count-') || matrix.profile == 'probes-only'
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 2 https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz -o llvm-cov.tar.gz
          echo 'b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a  llvm-cov.tar.gz' | sha256sum -c -
          mkdir -p cov-bin
          tar xzf llvm-cov.tar.gz -C cov-bin
          echo "$RUNNER_TEMP/cov-bin" >> "$GITHUB_PATH"
      - run: python3 review-coverage/study.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ${{ matrix.profile }}
          path: report/
          if-no-files-found: error
          retention-days: 14
