name: Measure Miri worker parallelism
on:
  push:
    branches: [review/miri-worker-parallel-20261125044157]
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      RUSTUP_TOOLCHAIN: nightly
      MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-tree-borrows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - run: |
          cargo miri setup
          cargo miri test --locked --target x86_64-unknown-linux-gnu --test '[!abmqr]*' -- --list >/dev/null
          python3 -u worker-bench.py
