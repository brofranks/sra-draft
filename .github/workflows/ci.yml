name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  i686:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: rustup toolchain install stable --profile minimal --target i686-unknown-linux-gnu
      - run: cargo test --locked --all-targets --target i686-unknown-linux-gnu

  miri:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, i686-unknown-linux-gnu]
        borrows: [stacked, tree]
    name: miri (${{ matrix.target }}, ${{ matrix.borrows }} borrows)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: nightly
      MIRIFLAGS: ${{ matrix.borrows == 'tree' && '-Zmiri-tree-borrows' || '' }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install $RUSTUP_TOOLCHAIN --profile minimal --component miri,rust-src
      - run: cargo miri test --locked --test soundness --target ${{ matrix.target }}
      # Named tests follow. Each step checks its pass count, so a renamed test
      # fails the step instead of silently dropping out.
      #
      # Two arenas sharing one reservation-cache cell, which the fixture does not
      # reach.
      - run: >-
          cargo miri test --locked --lib --target ${{ matrix.target }} -- --exact
          util::dag::tests::cached_batches_remain_owned_when_arena_cache_cells_collide
          | tee /dev/stderr | grep '^test result: ok. 1 passed'
      # Unwinding out of DAG construction, which the fixture does not reach.
      - run: >-
          cargo miri test --locked --test dag --target ${{ matrix.target }} -- --exact
          a_panicking_pinned_iterator_drops_initialized_values_once
          | tee /dev/stderr | grep '^test result: ok. 1 passed'
      # Miri checks one thread schedule per seed. Sweep seeds over the fixture.
      - if: matrix.target == 'x86_64-unknown-linux-gnu' && matrix.borrows == 'stacked'
        run: cargo miri test --locked --test soundness --target ${{ matrix.target }}
        env:
          MIRIFLAGS: -Zmiri-many-seeds=0..8
