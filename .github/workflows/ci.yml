name: Sparse review focused Miri
on: push
permissions:
  contents: read
jobs:
  focused:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, i686-unknown-linux-gnu]
        borrows: [stacked, tree]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTUP_TOOLCHAIN: nightly
      MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check ${{ matrix.borrows == 'tree' && '-Zmiri-tree-borrows' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - run: >-
          cargo miri test --locked --target ${{ matrix.target }} --lib --
          sparse::tests::alignment_and_quotient_renumber_by_first_occurrence
          sparse::tests::a_refinement_groups_selected_slots_and_forgets_declined_ones
          sparse::tests::refinement_restart_clears_slots_after_a_selector_panic
          sparse::tests::refinement_delivery_can_collect_and_reenter_the_store
          sparse::tests::retained_roots_and_member_cursors_survive_collection
          sparse::tests::repeated_bindings_share_live_roots
          sparse::tests::a_unique_table_collision_compares_the_stored_
          sparse::tests::counts_reach_the_universe_boundary_at_every_layout
