name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  i686:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: rustup toolchain install stable --profile minimal --target i686-unknown-linux-gnu
      - run: cargo test --locked --all-targets --target i686-unknown-linux-gnu

  miri:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, i686-unknown-linux-gnu]
    name: miri (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - run: cargo +nightly miri test --locked --test soundness --target ${{ matrix.target }}
      # The BDD store's own unsafe code, and its use of the DAG across threads,
      # collection, growth, and reentry.
      - run: >-
          cargo +nightly miri test --locked --lib --target ${{ matrix.target }} -- --exact
          bdd::tests::level_buffer_preserves_its_initialized_prefix_when_full
          bdd::tests::concurrent_operations_preserve_canonical_roots_across_collection
          bdd::tests::retained_roots_and_member_cursors_survive_collection
          bdd::tests::refinement_delivery_can_collect_and_reenter_the_store
          bdd::tests::sets_cuts_and_bit_tests_survive_growth
