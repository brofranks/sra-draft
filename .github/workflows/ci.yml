name: CI

on:
  push:
    branches: [main, 'scratch/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy && rustup default 1.100.0
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --release --all-targets
      - run: cargo test --locked --doc
      - run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  i686:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: rustup toolchain install 1.100.0 --profile minimal --target i686-unknown-linux-gnu && rustup default 1.100.0
      - run: cargo test --locked --all-targets --target i686-unknown-linux-gnu

  miri:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, i686-unknown-linux-gnu]
        borrows: [stacked, tree]
    name: miri (${{ matrix.target }}, ${{ matrix.borrows }} borrows)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: nightly
      MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check ${{ matrix.borrows == 'tree' && '-Zmiri-tree-borrows' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install $RUSTUP_TOOLCHAIN --profile minimal --component miri,rust-src
      # Tests too slow for Miri opt out with `cfg_attr(miri, ignore)`.
      - run: cargo miri test --locked --target ${{ matrix.target }}
      # Miri checks one thread schedule per seed. Sweep seeds over soundness tests.
      - if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: >-
          MIRIFLAGS="$MIRIFLAGS -Zmiri-many-seeds=1..8"
          cargo miri test --locked --test soundness --target ${{ matrix.target }}

  mutant:
    name: mutant (no label rollback)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal && rustup default 1.100.0
      - name: Apply mutant
        run: |
          python3 - <<'MUT'
          old = "|out| out.truncate(start)"
          s = open("src/bdd.rs").read()
          assert s.count(old) == 1
          open("src/bdd.rs", "w").write(s.replace(old, "|_out| ()"))
          MUT
          git diff
      - name: Tests must fail
        run: |
          set +e
          cargo test --locked --test bdd 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          grep -E "^test .* FAILED|panicked" test.log
          test "$status" -ne 0
