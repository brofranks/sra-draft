name: Sparse review baseline
on: push
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.100.0 --profile minimal --component rustfmt,clippy && rustup default 1.100.0
      - run: cargo test --locked --lib sparse::tests::
      - run: cargo test --locked --release --lib sparse::tests::
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - if: '!cancelled()'
        run: cargo doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
  sparse-miri-tree:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: nightly
      MIRIFLAGS: -Zmiri-strict-provenance -Zmiri-symbolic-alignment-check -Zmiri-tree-borrows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --component miri,rust-src
      - run: cargo miri test --locked --target x86_64-unknown-linux-gnu --lib sparse::tests::
