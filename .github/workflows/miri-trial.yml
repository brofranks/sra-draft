name: miri-trial
on: push
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  resume:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-unknown-linux-gnu, i686-unknown-linux-gnu]
        tree: [fixed, unfixed]
        seed: [0, 1, 2, 3]
    name: resume (${{ matrix.target }}, ${{ matrix.tree }}, seed ${{ matrix.seed }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install nightly-2026-11-14 --profile minimal --component miri,rust-src
      - run: cargo +nightly-2026-11-14 miri setup --target ${{ matrix.target }}
      - if: matrix.tree == 'unfixed'
        run: cp repro/dag.rs src/util/dag.rs
      - run: cargo +nightly-2026-11-14 miri test --locked --target ${{ matrix.target }} --test dag --no-run
      - env:
          MIRIFLAGS: -Zmiri-seed=${{ matrix.seed }}
        run: >-
          timeout 300 cargo +nightly-2026-11-14 miri test --locked --target ${{ matrix.target }}
          --test dag -- --exact workers_resume_reserved_batches_after_compaction
          -Zunstable-options --report-time
