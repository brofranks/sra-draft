name: BDD coverage
on:
  push:
    branches: [coverage/bdd-3af3bab-pu1bhktm]
permissions:
  contents: read
jobs:
  coverage:
    name: ${{ matrix.profile }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {profile: stable-lines, rust: 1.100.0}
          - {profile: nightly-branches, rust: nightly-2026-11-19}
          - {profile: nightly-unit, rust: nightly-2026-11-19}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
      PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Extract the production commit
        run: |
          mkdir -p "$RUNNER_TEMP/audit-source" "$GITHUB_WORKSPACE/report"
          test "$(git rev-parse HEAD^)" = 3af3babb73584b0c169d74ce8ea46ed5ef791958
          git archive 3af3babb73584b0c169d74ce8ea46ed5ef791958 | tar xf - -C "$RUNNER_TEMP/audit-source"
          git rev-parse 'HEAD^^{tree}' > report/source-tree
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component llvm-tools-preview
      - name: Install cargo-llvm-cov 0.9.1
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 2 https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz -o llvm-cov.tar.gz
          echo 'b3f68e625481fed9b16444174f3fa5ebcdbde4a1878803a35eabe2dcefcdc41a  llvm-cov.tar.gz' | sha256sum -c -
          mkdir -p cov-bin
          tar xzf llvm-cov.tar.gz -C cov-bin
          echo "$RUNNER_TEMP/cov-bin" >> "$GITHUB_PATH"
      - name: Measure the checked-in tests
        shell: bash
        run: |
          cd "$RUNNER_TEMP/audit-source"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/cov-$PROFILE"
          out="$GITHUB_WORKSPACE/report"
          rustc -Vv > "$out/rustc.txt"
          cargo -V > "$out/cargo.txt"
          cargo llvm-cov --version > "$out/llvm-cov.txt"
          files=(--ignore-filename-regex '/tests/|/examples/|/macros/')
          case "$PROFILE" in
            stable-lines) suite=(--all-targets) ;;
            nightly-branches) suite=(--all-targets --branch --show-missing-lines) ;;
            nightly-unit) suite=(--lib --branch --show-missing-lines) ;;
          esac
          cargo llvm-cov --locked "${suite[@]}" "${files[@]}" 2> "$out/test.log" | tee "$out/summary.txt"
          cargo llvm-cov report --json "${files[@]}" --output-path "$out/coverage.json"
          cargo llvm-cov report --lcov "${files[@]}" --output-path "$out/coverage.lcov"
          cargo llvm-cov report --show-missing-lines "${files[@]}" > "$out/lines.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: ${{ matrix.profile }}
          path: report/
          if-no-files-found: error
          retention-days: 14
